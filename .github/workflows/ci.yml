name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Testes com o driver do banco na nuvem (libsql)
        run: npm test
        env:
          TEST_DATABASE_URL: file:${{ runner.temp }}/teste.db
      - run: node --check public/app.js && node --check public/media.js
