name: Teste no ar

# Abre o site publicado com 3 pessoas (navegadores de verdade) e testa chat, voz e tela.
# Usa as contas fixas teste.ana, teste.bia e teste.caio (criadas antes da mensalidade, então grátis) e apaga o servidor de teste no fim.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Endereço do site (vazio usa STRAIGHTTALK_URL ou o do Render)'
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Esperar o Render publicar este commit
        env:
          URL: ${{ inputs.url || vars.STRAIGHTTALK_URL || 'https://straighttalk.onrender.com' }}
        run: |
          for i in $(seq 1 60); do
            v=$(curl -fsS --max-time 60 "$URL/healthz" | jq -r '.version // empty' || true)
            echo "no ar: ${v:-?}"
            if [ "$v" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 15
          done
          echo "::warning::O site ainda não está com o commit $GITHUB_SHA; testando a versão no ar"
      # Senha das contas fixas teste.ana/bia/caio, tirada de um segredo que já existe (ninguém precisa digitar nada)
      - name: Senha das contas de teste
        env:
          SEED: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          p=$(printf '%s' "straighttalk-e2e:$SEED" | sha256sum | cut -c1-32)
          echo "::add-mask::$p"
          echo "E2E_PASSWORD=$p" >> "$GITHUB_ENV"
      - run: mkdir -p prints && node test/e2e.js "$URL" prints
        env:
          URL: ${{ inputs.url || vars.STRAIGHTTALK_URL || 'https://straighttalk.onrender.com' }}
          E2E_CLEANUP: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints
          path: prints
